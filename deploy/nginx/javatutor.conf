# ============================================================
# JavaTutor Nginx 站点配置
# 服务器路径: /etc/nginx/sites-available/javatutor
# 启用: ln -s /etc/nginx/sites-available/javatutor /etc/nginx/sites-enabled/
# ============================================================
server {
    listen 80;
    server_name _;  # 改成你的域名，如 javatutor.example.com

    # 前端静态文件
    root /var/www/javatutor;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # API 反向代理 → Spring Boot（只走内网 127.0.0.1）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（AI 流式响应必需）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

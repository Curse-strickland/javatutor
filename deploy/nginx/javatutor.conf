# ============================================================
# JavaTutor Nginx 站点配置 —— 部署结构参考
# 线上路径: /etc/nginx/sites-available/javatutor
#           （启用为 /etc/nginx/sites-enabled/javatutor，当前是该目录下唯一文件）
#
# ⚠️ 不要把本文件直接 cp 到服务器覆盖线上配置。
#    线上一份是**由 certbot 管理**的（含 listen 443 ssl、证书指令、
#    4 个域名、HTTP→HTTPS 跳转块）。覆盖它会丢掉 HTTPS 与多域名。
#    改线上 nginx 前先 `sudo nginx -T` 看现状，改完 `sudo nginx -t` 再 reload。
#
# 线上真实布局（2026-09-15 实测）：
#   root 是 /var/www/html，而它是软链 → /opt/javatutor/dist
#   （/var/www/javatutor 是 2026-07-19 迁移前的旧路径，nginx 已不再服务它）
#   后端 Spring Boot 监听 127.0.0.1:8080，仅经 /api/ 反代暴露
#
# 本文件保留头部与 location 段的写法供参考；下面的 server_name / listen
# 是**占位值**，不是线上值。完整现状见产品发布页仓的
# docs/plan/2026-09-15-product-intro-page-integration-plan.md §4（T0 取证）。
# ============================================================
server {
    listen 80;
    # 线上实际值：
    #   javatutor.cn www.javatutor.cn miaomiaomiaomiao.javatutor.cn meowmeowmeowmeow.javatutor.cn
    server_name javatutor.cn www.javatutor.cn;

    # 前端静态文件。软链 /var/www/html → /opt/javatutor/dist，
    # 由 .github/workflows/deploy.yml 的 rsync 写入（TARGET=/opt/javatutor/）。
    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # API 反向代理 → Spring Boot（只走内网 127.0.0.1）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（AI 流式响应必需）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

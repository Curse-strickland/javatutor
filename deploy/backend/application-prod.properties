# ============================================================
# JavaTutor 生产环境配置
# 放到服务器上 /opt/javatutor/application-prod.properties
# 启动时通过 --spring.profiles.active=prod 加载
# 敏感信息通过环境变量注入，不写死在文件里
# ============================================================

server.port=8080
server.address=127.0.0.1
# 仅监听本机回环地址，外部无法直接访问

# AI API Key — 通过环境变量设置
deepseek.api.key=${ZHIPU_API_KEY}

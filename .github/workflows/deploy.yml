# ============================================================
# CD（持续部署）— 只当 push 到 main 分支时触发
# 作用：代码合并后自动构建 → 推到服务器 → 重启服务
# ============================================================

name: Deploy  # 在 GitHub Actions 标签页显示的名称

# ── 触发条件 ──────────────────────────────────────────────
on:
  push:
    branches: [main]           # 只有 main 分支 push 才触发部署
  # 注意：PR 不会触发此文件，避免未审核代码直接上生产
  # 如果希望手动触发部署，可以取消下面这行的注释：
  # workflow_dispatch: {}

# ── 权限配置 ──────────────────────────────────────────────
# GITHUB_TOKEN 默认不能创建 Deployment 记录，需要显式授权
permissions:
  contents: read
  deployments: write

# ── 任务定义 ──────────────────────────────────────────────
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Step 1：拉取代码
      # ==========================================================
      - uses: actions/checkout@v4
        # GitHub 官方 action，把仓库代码 checkout 到 CI 环境

      # ==========================================================
      # Step 2：安装 JDK 17
      # ==========================================================
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'       # Eclipse Temurin（开源无授权风险）
          cache: maven                  # 缓存 Maven 依赖（~/.m2），加速后续构建

      # ==========================================================
      # Step 3：修复 mvnw 可执行权限（Windows 提交的文件在 Linux 上没有 +x）
      # ==========================================================
      - name: 赋予 mvnw 执行权限
        run: chmod +x backend/mvnw

      # ==========================================================
      # Step 4：Maven 打包 → 产出可执行 jar
      # ==========================================================
      - name: 构建后端 jar
        run: cd backend && ./mvnw package -DskipTests
        # package = 编译 + 打包成 .jar（spring-boot-maven-plugin 会生成 fat jar）
        # -DskipTests = 跳过测试（CI 文件里已经跑过测试了，这里省时间不复跑）
        # 产物路径：backend/target/javatutor-backend-0.1.0.jar

      # ==========================================================
      # Step 4：安装 Node.js 18
      # ==========================================================
      - name: 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ==========================================================
      # Step 5：Vite 构建前端静态文件
      # ==========================================================
      - name: 构建前端 dist
        run: cd frontend && npm ci && npm run build
        # npm ci = 严格按 lock 文件安装（CI 环境专用，不用 npm install）
        # npm run build = vite build → 产出 frontend/dist/
        # dist/ 里的 index.html + js/css 就是前端全部（纯静态文件）

      # ==========================================================
      # Step 6：创建 GitHub Deployment 记录（右侧面板可见）
      # ==========================================================
      - name: 开始部署
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          desc: "部署到阿里云 ECS"

      # ==========================================================
      # Step 7：通过 rsync + SSH 把构建产物传到服务器
      # ==========================================================
      - name: 部署到服务器
        uses: easingthemes/ssh-deploy@v5.1.1
        # 这是一个社区 action，封装了 rsync over SSH 的逻辑
        with:
          # ── SSH 认证（全部来自 GitHub Secrets，不写死在代码里）──
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # ↑ 私钥内容（不是文件路径），在 Settings → Secrets 里设置

          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          # ↑ 服务器公网 IP

          REMOTE_USER: ${{ secrets.SSH_USER }}
          # ↑ 登录用户名（建议用非 root 用户，如 javatutor）

          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          # ↑ SSH 端口（22 端口）

          # ── rsync 参数 ─────────────────────────────────────
          ARGS: "-avz --delete"
          # -a = 归档模式，保留文件权限和时间戳
          # -v = 输出详细信息（方便排查部署失败）
          # -z = 传输时压缩（省带宽）
          # --delete = 删除服务器上多余的文件（保证服务器和构建结果完全一致）

          # ── 要传输的文件/目录（相对于仓库根目录）────────
          SOURCE: "backend/target/javatutor-backend-0.1.0.jar frontend/dist"
          # dist 尾部无 / = 保留 dist 目录本身传到 TARGET 下
          # jar 是单个文件，直接放在 TARGET 根目录

          # ── 服务器目标路径 ────────────────────────────────
          TARGET: "/opt/javatutor/"
          # rsync 传过去后的实际结构（扁平化）：
          #   /opt/javatutor/javatutor-backend-0.1.0.jar
          #   /opt/javatutor/dist/index.html
          #   /opt/javatutor/dist/assets/...

          # ── 传输完成后在服务器上执行的命令 ────────────────
          SCRIPT_AFTER: |
            # 写入 Coze / Agent token 到环境文件（若 GitHub Secrets 已配置）
            sudo mkdir -p /opt/javatutor/config
            {
              if [ -n "${{ secrets.COZE_API_TOKEN }}" ]; then
                echo "COZE_API_TOKEN=${{ secrets.COZE_API_TOKEN }}"
              fi
              # 执行上下文接口的共享 token：与 Coze 侧 JAVATUTOR_AGENT_TOKEN 必须一致
              if [ -n "${{ secrets.JAVATUTOR_AGENT_TOKEN }}" ]; then
                echo "JAVATUTOR_AGENT_TOKEN=${{ secrets.JAVATUTOR_AGENT_TOKEN }}"
              fi
            } | sudo tee /opt/javatutor/config/coze.env > /dev/null
            sudo systemctl restart javatutor
            sudo systemctl reload nginx
          # 环境文件 /opt/javatutor/config/coze.env 由 systemd 服务 javatutor.service 通过
          # EnvironmentFile=/opt/javatutor/config/coze.env 读取；token 不写入 jar，运行时注入。
          # 服务器 systemd 配置示例见 docs/deploy-coze.md
          # restart javatutor = 重启 Spring Boot 后端（新的 jar 生效）
          # reload nginx = 让 nginx 重新读配置 + 刷新静态文件缓存
          # 注意：这两个命令要求服务器上已配置好 systemd 服务和 nginx

      # ==========================================================
      # Step 8：标记部署状态（成功 / 失败）
      # ==========================================================
      - name: 标记部署成功
        uses: bobheadxi/deployments@v1
        if: success()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          status: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: 标记部署失败
        uses: bobheadxi/deployments@v1
        if: failure()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          status: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

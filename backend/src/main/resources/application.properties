server.port=8080
server.address=127.0.0.1
# 仅监听本机回环地址，外部无法直接访问

# Coze：用 Boot 标准 import 加载（勿只靠 @Service 上的 @PropertySource，本地文件常读不到）
# 后者 coze-local.properties 可覆盖 token（gitignore）；线上仍用环境变量 COZE_API_TOKEN
spring.config.import=optional:classpath:coze.properties,optional:classpath:coze-local.properties

# AI 解说服务 — 智谱 GLM-4 Flash（免费模型）
# 用户需在前端填入自己的 Key，或通过环境变量 ZHIPU_API_KEY 设置
deepseek.api.url=https://open.bigmodel.cn/api/paas/v4/chat/completions
deepseek.api.model=glm-4.7-flash
deepseek.api.key=${ZHIPU_API_KEY:}
